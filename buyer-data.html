<html>
<head>
    <title>CABO - Buyer Data</title>
    <link rel="stylesheet" href="buyer-datastyle.css">
</head>

<body>

    <h1>Registered Buyers</h1>
    <button id="clearData">Clear Buyer Data</button>

    <table border="1">
        <thead>
            <tr>
                <th>Organisation</th>
                <th>Email</th>
                <th>Contact Person</th>
                <th>Phone Number</th>
                <th>Target</th>
                <th>Company Type</th>
            </tr>
        </thead>

        <tbody id="buyerTable"></tbody>
    </table>

<script>
    const buyers = JSON.parse(localStorage.getItem("buyers")) || [];
    const table = document.getElementById("buyerTable");

    buyers.forEach(function(buyer) {
        const row = document.createElement("tr");

        const company = document.createElement("td");
        company.textContent = buyer.company;
        row.appendChild(company);

        const email = document.createElement("td");
        email.textContent = buyer.email;
        row.appendChild(email);

        const contact = document.createElement("td");
        contact.textContent = buyer.contact;
        row.appendChild(contact);
        
        const phone = document.createElement("td");
        phone.textContent = buyer.phone;
        row.appendChild(phone);

        const target = document.createElement("td");
        target.textContent = buyer.target;
        row.appendChild(target);

        const companyType = document.createElement("td");
        companyType.textContent = buyer.companyType;
        row.appendChild(companyType);

        table.appendChild(row);
        
    });
        document.getElementById("clearData").addEventListener("click", function() {
        localStorage.removeItem("buyers");
        table.innerHTML = "";
        alert("Buyer data cleared successfully!");
    });
</script>
  

</body>
</html>
