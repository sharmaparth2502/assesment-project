<html>
<head>
    <title>CABO - Buyer Data</title>
    <link rel="stylesheet" href="buyer-datastyle.css">
</head>

<body>

    <h1>Registered Buyers</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Organisation</th>
                <th>Email</th>
                <th>Contact</th>
                <th>Target</th>
                <th>Company Type</th>
            </tr>
        </thead>

        <tbody id="buyerTable"></tbody>
    </table>
    <script>
        const buyers = JSON.parse(localStorage.getItem("buyers")) || [];
        const table = document.getElementById("buyerTable");

        buyers.forEach(function(buyer) {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${buyer.company}</td>
                <td>${buyer.email}</td>
                <td>${buyer.contact}</td>
                <td>${buyer.target}</td>
                <td>${buyer.companyType}</td>
            `;

            table.appendChild(row);
        });
    </script>    

</body>
</html>
