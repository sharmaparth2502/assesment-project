<!DOCTYPE html>
<html>
<head>
    <title>CABO - Login</title>
    <link rel="stylesheet" href="indexstyle.css">
</head>

<body>

<div class="top">
    <div class="logo">CABO</div>

    <div class="nav">
        <a href="index.html">LOGIN</a>
        <a href="buyer.html">BUYER</a>
    </div>
</div>

<div class="login-page">

    <div class="login-box">

        <p class="small">CABO NETWORK / SECURE ACCESS</p>

        <h1>WELCOME TO CABO</h1>

        <p>Turning distributed solar into measurable climate impact.</p>

        <form id="loginForm">

            <label>Email</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password"
                   placeholder="Enter your password" required>

            <button type="submit">
                LOGIN →
            </button>

            <p id="message"></p>

        </form>

        <p class="register">
            New to CABO?
            <a href="buyer.html">Register your rooftop solar system.</a>
        </p>

    </div>

</div>

<script>

    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;

        let buyers = JSON.parse(localStorage.getItem("buyers")) || [];

        let buyer = buyers.find(function(item) {
            return item.email.toLowerCase() === email.toLowerCase()
                && item.password === password;
        });

        if (buyer) {

            localStorage.setItem("loggedInBuyer", JSON.stringify(buyer));

            window.location.href = "buyer-dashboard.html";

        }

        else if (email === "seller@cabo.demo" && password === "demo123") {

            window.location.href = "seller-dashboard.html";

        }

        else {

            document.getElementById("message").textContent = "Invalid email or password!";

        }

    });

</script>

</body>
</html>
