<html>
<head>
    <title>CABO - Buyer Registration</title>
    <link rel="stylesheet" href="buyerstyle.css">
</head>

<body>

    <div class="top">
        <div class="logo">CABO</div>

        <div class="nav">
            <a href="index.html">SELLER</a>
            <a href="buyer.html">BUYER</a>
        </div>
    </div>

    <div class="register-page">
        <div class="register-box">

            <p class="small">CABO NETWORK / BUYER ACCESS</p>

            <h1>BUYER REGISTRATION</h1>

            <p>Register your organisation to explore carbon credits.</p>

            <form id="buyerForm">

                <label>Organisation</label>
                <input type="text" id="company"
                       placeholder="Company name" required>

                <label>Work Email</label>
                <input type="email" id="email"
                       value="buyer@cabo.demo" required>

                <label>Contact Person Name</label>
                <input type="text" id="contact"
                       value="Aarav Mehta" required>

                <label>Password</label>
                <input type="password" id="password"
                       minlength="6" required>

                <label>Procurement Target</label>
                <input type="text" id="target"
                       value="10,000 tCO₂e" required>

                <label>Company Type</label>
                <select id="companyType" required>
                    <option value="">Select company type</option>
                    <option value="Private Company">Private Company</option>
                    <option value="Public Company">Public Company</option>
                    <option value="Startup">Startup</option>
                    <option value="Other">Other</option>
                </select>

                <div class="check">
                    <input type="checkbox" id="terms" required>
                    <span>I agree to the CABO terms and conditions.</span>
                </div>

                <button type="submit">REGISTER ACCOUNT →</button>

            </form>

            <p class="register">
                Already registered?
                <a href="index.html">Go to Seller Login</a>
            </p>

        </div>
    </div>

    <script>
        const form = document.getElementById("buyerForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const buyer = {
                company: document.getElementById("company").value,
                email: document.getElementById("email").value,
                contact: document.getElementById("contact").value,
                target: document.getElementById("target").value,
                companyType: document.getElementById("companyType").value
            };
            
            let buyers = JSON.parse(localStorage.getItem("buyers")) || [];

            let existingBuyer = buyers.find(function(item) {
                return item.email.toLowerCase() === buyer.email.toLowerCase();
            });

            if (existingBuyer) {
                alert("This email is already registered!");
                return;
            }

            buyers.push(buyer);

            localStorage.setItem("buyers", JSON.stringify(buyers));


            alert("Buyer registration submitted successfully!");

            form.reset();
        });
    </script>

</body>
</html>
