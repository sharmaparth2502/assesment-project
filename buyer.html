<!DOCTYPE html>
<html>

<head>
    <title>CABO - Buyer Registration</title>
    <link rel="stylesheet" href="buyerstyle.css">
</head>

<body>

    <div class="top">
        <div class="logo">CABO</div>

        <div class="nav">
            <a href="index.html">SELLER</a>
            <a href="buyer.html">BUYER</a>
        </div>
    </div>

    <div class="page">
        <div class="form-box">

            <p class="small">CABO CREATE BUYER ACCOUNT</p>

            <h1>PROCURE VERIFIED CLIMATE IMPACT AT THE SOURCE.</h1>

            <p>
                Transparent rooftop-solar inventory,
                traceable telemetry and audit-ready settlement.
            </p>

            <form onsubmit="alert('Registration form submitted!'); return false;">

                <label>Organisation</label>
                <input type="text" placeholder="Company name" required>

                <label>Work Email</label>
                <input type="email" value="buyer@cabo.demo" required>

                <label>Contact</label>
                <input type="text" value="Aarav Mehta" required>

                <label>Password</label>
                <input type="password" value="demo123" minlength="6" required>

                <label>Procurement Target</label>
                <input type="text" value="10,000 tCO₂e" required>

                <label>Company Type</label>
                <select required>
                    <option value="Corporate buyer">Corporate buyer</option>
                    <option value="Institution">Institution</option>
                    <option value="Other">Other</option>
                </select>

                <div class="check">
                    <input type="checkbox" required>
                    <span>I agree to the CABO terms and conditions.</span>
                </div>

                <button type="submit">
                    REGISTER ACCOUNT →
                </button>

            </form>

            <p class="bottom">
                Already registered?
                <a href="index.html">Login here</a>
            </p>

        </div>
    </div>

</body>
</html>
